[package]
name = "trillium-sse"
version = "0.4.0"
edition = "2024"
description = "server sent events for trillium.rs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/trillium-rs/trillium"
readme = "README.md"
keywords = ["trillium", "framework", "async"]
categories = ["web-programming::http-server", "web-programming"]

[dependencies]
fieldwork = "0.5.3"
futures-lite = "2.6.1"
log = "0.4.29"
sync_wrapper = "1.0.2"
trillium.workspace = true
trillium-server-common.workspace = true

[dev-dependencies]
broadcaster = "1.0.0"
env_logger = "0.11.11"
trillium-logger = { path = "../logger" }
trillium-quinn = { path = "../quinn" }
trillium-rustls = { path = "../rustls" }
trillium-smol = { path = "../smol" }
trillium-static-compiled = { path = "../static-compiled" }
trillium-testing = { path = "../testing" }
