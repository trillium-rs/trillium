[package]
name = "trillium-quinn"
version = "0.1.8"
edition = "2024"
description = "quinn QUIC adapter for trillium.rs HTTP/3 support"
license = "MIT OR Apache-2.0"
repository = "https://github.com/trillium-rs/trillium"
keywords = ["trillium", "framework", "async", "quic", "h3"]
categories = ["web-programming::http-server", "web-programming"]
readme = "README.md"

[package.metadata.cargo-udeps.ignore]
development = ["h3i", "rcgen", "trillium-testing"]

[features]
default = ["aws-lc-rs", "platform-verifier"]
aws-lc-rs = ["quinn/rustls-aws-lc-rs", "rustls/aws-lc-rs"]
ring = ["quinn/rustls-ring", "rustls/ring"]
custom-crypto-provider = ["quinn/rustls"]
platform-verifier = ["dep:rustls-platform-verifier"]
# webpki-roots is always available; this no-op keeps existing feature declarations resolving.
webpki-roots = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(quinn_testing)"] }

[dependencies]
async-compat = "0.2"
futures-lite = "2"
log = "0.4"
quinn = { version = "0.11", default-features = false, features = ["log"] }
rustls = { version = "0.23", default-features = false }
rustls-platform-verifier = { version = "0.7.0", optional = true }
webpki-roots = "1.0"
trillium-macros.workspace = true
trillium-server-common = { version = "0.7.12", path = "../server-common" }


[dev-dependencies]
async-channel = "2.5.0"
env_logger = "0.11.10"
h3i = "0.7.0"
rcgen = "0.14.7"
trillium = { path = "../trillium" }
trillium-client = { path = "../client" }
trillium-logger = { path = "../logger" }
trillium-rustls = { path = "../rustls" }
trillium-testing = { path = "../testing" }
trillium-tokio = { path = "../tokio" }
